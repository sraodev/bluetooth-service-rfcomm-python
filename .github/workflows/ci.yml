name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cli sdk/go)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/ubtd ./cli/ubtd
      - run: go build -o bin/ubt ./cli/ubtctl
      - run: go build -o bin/ubtctl ./cli/ubtctl
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/smoke.py
      - run: python3 -m unittest discover -s examples/chat -p 'test_*.py' -v
  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    env:
      GORELEASER_VERSION: v2.18.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Verify release bundle matrix
        shell: bash
        run: |
          for os in darwin linux; do
            for arch in amd64 arm64; do
              archive="dist/universal-bluetooth-sdk_${os}_${arch}.tar.gz"
              test -f "$archive"
              for binary in ubt ubtctl ubtd; do
                tar -tzf "$archive" | grep -Fx "$binary"
              done
            done
          done
          (cd dist && sha256sum --check checksums.txt)
